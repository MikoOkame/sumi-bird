<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>墨鳥</title>
    <link rel="icon" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --paper: #e8e0d0;
        --ink: #1c1916;
        --wash: #6e675e;
        --seal: #b23a2f;
        --chip: #efe8da;
        --display: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
        --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }
      button { font: inherit; color: inherit; }
      button:not(:disabled) { cursor: pointer; }
      #stage { position: fixed; inset: 0; touch-action: none; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      header {
        pointer-events: none;
        position: fixed;
        inset: 0 0 auto 0;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: max(0.9rem, env(safe-area-inset-top)) 16px 0;
      }
      .seal {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex: none;
        border: 2px solid var(--seal);
        color: var(--seal);
        font-family: var(--display);
        font-weight: 700;
        font-size: 18px;
      }
      h1 {
        margin: 2px 0 0;
        font-family: var(--display);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
      }
      header p { margin: 6px 0 0; color: var(--wash); font-size: 14px; line-height: 1.35; }
      #status {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 2;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #status p { margin: 0; font-family: var(--display); font-size: 18px; color: var(--wash); }
      #retry {
        height: 44px;
        padding: 0 16px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-size: 14px;
      }
      footer {
        position: fixed;
        inset: auto 0 0 0;
        border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
        background: var(--paper);
        padding: 12px 12px max(0.75rem, env(safe-area-inset-bottom));
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .row + .row { margin-top: 8px; }
      .modes, .icon {
        height: 44px;
        border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent);
        background: var(--paper);
      }
      .modes { display: flex; flex: none; }
      .modes button { padding: 0 12px; font-size: 14px; }
      .modes button + button { border-left: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); }
      .modes button[aria-pressed="true"], .chip[aria-selected="true"] {
        background: var(--ink);
        color: var(--paper);
      }
      #clip-name {
        flex: 1;
        min-width: 0;
        margin: 0;
        text-align: center;
        font-family: var(--display);
        font-size: 18px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 44px;
        flex: none;
        background: var(--chip);
      }
      .icon:disabled { opacity: 0.4; }
      #clips {
        display: flex;
        flex: 1;
        min-width: 0;
        gap: 6px;
        overflow-x: auto;
      }
      .chip {
        height: 44px;
        flex: none;
        padding: 0 12px;
        background: var(--chip);
        font-size: 14px;
        white-space: nowrap;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <header>
      <span class="seal" aria-hidden="true">鳥</span>
      <div>
        <h1>墨鳥</h1>
        <p>ドラッグで回す · ピンチで寄る</p>
      </div>
    </header>
    <div id="status">
      <p id="status-text">墨をすっています</p>
      <button id="retry" class="hidden" type="button">もう一度</button>
    </div>
    <footer>
      <div class="row">
        <div class="modes" role="group" aria-label="描き方">
          <button id="ink-on" type="button" aria-pressed="true">墨</button>
          <button id="ink-off" type="button" aria-pressed="false">素体</button>
        </div>
        <p id="clip-name">待機</p>
        <button id="reset" class="icon" type="button" aria-label="視点を戻す">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 4v5h5" />
          </svg>
        </button>
      </div>
      <div class="row">
        <button id="prev" class="icon" type="button" aria-label="前の動き" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M15 6 9 12l6 6" /></svg>
        </button>
        <div id="clips" role="tablist" aria-label="動き"></div>
        <button id="next" class="icon" type="button" aria-label="次の動き" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m9 6 6 6-6 6" /></svg>
        </button>
      </div>
    </footer>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const CLIP_LABEL = {
        idle: "待機", takeoff: "飛び立ち", flying: "飛行", glide: "滑空", landing: "着地",
        hop: "跳ね", hop_big: "大跳ね", hover: "停空", turn_L: "左旋回", turn_R: "右旋回",
        dive_in: "急降下・入", dive: "急降下", peck: "ついばみ", sit_in: "腰を下ろす", sit: "座る",
        sit_out: "立ち上がる", stretch: "伸び", preen: "羽繕い", peer_in: "覗き込み", peer: "覗く",
        peer_out: "覗き終わり", alert_in: "警戒・入", alert: "警戒", alert_out: "警戒・出",
        sing: "さえずり", sing_hop: "鳴いて跳ね", walk: "歩き", struggle: "もがき",
      };
      const labelOf = (name) => CLIP_LABEL[name] ?? name;

      const INK_VERT = `
#include <skinning_pars_vertex>
varying vec3 vNormal;
varying vec3 vWorldPos;
varying vec3 vViewDir;
void main() {
  #include <beginnormal_vertex>
  #include <skinbase_vertex>
  #include <skinnormal_vertex>
  #include <begin_vertex>
  #include <skinning_vertex>
  vec4 worldPos = modelMatrix * vec4(transformed, 1.0);
  vWorldPos = worldPos.xyz;
  vNormal = normalize(mat3(modelMatrix) * objectNormal);
  vViewDir = normalize(cameraPosition - worldPos.xyz);
  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;
      const INK_FRAG = `
uniform float uTime;
uniform vec3 uLightDir;
varying vec3 vNormal;
varying vec3 vWorldPos;
varying vec3 vViewDir;
float hash(vec3 p) {
  p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i), hash(i + vec3(1.0, 0.0, 0.0)), f.x),
        mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
    mix(mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),
        mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}
float fbm(vec3 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
  return v;
}
void main() {
  vec3 n = normalize(vNormal);
  float ndotl = max(dot(n, uLightDir), 0.0);
  float rim = pow(1.0 - max(dot(n, normalize(vViewDir)), 0.0), 2.5);
  float wash = smoothstep(0.15, 0.75, ndotl);
  float blotch = fbm(vWorldPos * 3.5 + vec3(uTime * 0.04, 1.7, 0.2));
  float grain = fbm(vWorldPos * 18.0);
  float dry = smoothstep(0.4, 0.7, fbm(vWorldPos * 6.0));
  float ink = clamp(wash * 0.75 + blotch * 0.18 + rim * 0.25, 0.0, 1.0);
  ink = mix(ink, ink * (0.85 + grain * 0.3), 0.6);
  ink *= mix(1.0, 0.7, dry * 0.4);
  vec3 paper = vec3(0.93, 0.89, 0.82);
  vec3 inkCol = vec3(0.08, 0.07, 0.06);
  vec3 mid = vec3(0.35, 0.32, 0.28);
  vec3 col = mix(paper, mid, ink * 0.6);
  col = mix(col, inkCol, smoothstep(0.45, 0.85, ink));
  col = mix(col, inkCol * 0.7, smoothstep(0.55, 0.95, rim) * 0.35);
  col += fbm(vWorldPos * 40.0) * 0.04;
  gl_FragColor = vec4(col, 1.0);
}
`;

      const stage = document.getElementById("stage");
      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const retry = document.getElementById("retry");
      const clipName = document.getElementById("clip-name");
      const clipsEl = document.getElementById("clips");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const inkOn = document.getElementById("ink-on");
      const inkOff = document.getElementById("ink-off");

      let api = null;
      let names = [];
      let active = "idle";
      let wantInk = true;
      let attempt = 0;

      function showStatus(mode) {
        statusEl.classList.toggle("hidden", mode === "ready");
        statusText.textContent = mode === "error" ? "読み込めませんでした" : "墨をすっています";
        retry.classList.toggle("hidden", mode !== "error");
      }

      function renderChips() {
        clipsEl.replaceChildren();
        prev.disabled = next.disabled = names.length === 0;
        clipName.textContent = labelOf(active);
        for (const name of names) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "chip";
          button.role = "tab";
          button.dataset.clip = name;
          button.textContent = labelOf(name);
          button.setAttribute("aria-selected", String(name === active));
          button.addEventListener("click", () => select(name));
          clipsEl.appendChild(button);
        }
        clipsEl.querySelector(`[data-clip="${CSS.escape(active)}"]`)?.scrollIntoView({
          inline: "center",
          block: "nearest",
        });
      }

      function select(name) {
        if (!names.includes(name)) return;
        active = name;
        api?.play(name);
        renderChips();
      }

      function step(dir) {
        if (names.length === 0) return;
        const i = Math.max(0, names.indexOf(active));
        select(names[(i + dir + names.length) % names.length]);
      }

      function setInk(nextInk) {
        wantInk = nextInk;
        inkOn.setAttribute("aria-pressed", String(nextInk));
        inkOff.setAttribute("aria-pressed", String(!nextInk));
        api?.setInk(nextInk);
      }

      prev.addEventListener("click", () => step(-1));
      next.addEventListener("click", () => step(1));
      inkOn.addEventListener("click", () => setInk(true));
      inkOff.addEventListener("click", () => setInk(false));
      document.getElementById("reset").addEventListener("click", () => api?.resetView());
      retry.addEventListener("click", () => boot(++attempt));

      function modelUrls() {
        return ["public/bird.glb", "bird.glb"].map((path) => new URL(path, document.baseURI).href);
      }

      async function fetchModel(parent) {
        let last = new Error("モデルを取得できません");
        for (const url of modelUrls()) {
          if (parent.aborted) throw new DOMException("aborted", "AbortError");
          const timeout = new AbortController();
          const timer = setTimeout(() => timeout.abort(), 8000);
          const onAbort = () => timeout.abort();
          parent.addEventListener("abort", onAbort, { once: true });
          try {
            const res = await fetch(url, { signal: timeout.signal });
            if (!res.ok) {
              last = new Error(`${url} ${res.status}`);
              continue;
            }
            return await res.arrayBuffer();
          } catch (err) {
            if (parent.aborted) throw new DOMException("aborted", "AbortError");
            last = err instanceof DOMException && err.name === "AbortError"
              ? new Error("モデルの取得が時間切れです")
              : err;
          } finally {
            clearTimeout(timer);
            parent.removeEventListener("abort", onAbort);
          }
        }
        throw last;
      }

      function ensoTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 512;
        const g = canvas.getContext("2d");
        g.translate(256, 256);
        g.rotate(-0.15);
        g.strokeStyle = "rgba(28, 25, 22, 0.45)";
        g.lineWidth = 18;
        g.lineCap = "round";
        g.beginPath();
        g.arc(0, 0, 168, 0.35, Math.PI * 1.72);
        g.stroke();
        g.strokeStyle = "rgba(28, 25, 22, 0.18)";
        g.lineWidth = 7;
        g.beginPath();
        g.arc(4, 6, 176, 0.55, Math.PI * 1.35);
        g.stroke();
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      async function mountViewer(isCancelled, signal) {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8e0d0);
        scene.fog = new THREE.Fog(0xe8e0d0, 7, 16);
        const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 50);
        const homePos = new THREE.Vector3(1.7, 1.05, 2.35);
        const homeTarget = new THREE.Vector3(0, 0.72, 0);
        camera.position.copy(homePos);
        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: false,
          powerPreference: "default",
          failIfMajorPerformanceCaveat: false,
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, window.innerWidth < 500 ? 1.5 : 2));
        renderer.setClearColor(0xe8e0d0, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        stage.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.copy(homeTarget);
        controls.minDistance = 0.7;
        controls.maxDistance = 7;
        controls.maxPolarAngle = Math.PI * 0.92;

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(24, 24),
          new THREE.MeshBasicMaterial({ color: 0xddd4c4 }),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        scene.add(ground);
        const enso = ensoTexture();
        const ensoMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(2.6, 2.6),
          new THREE.MeshBasicMaterial({ map: enso, transparent: true, depthWrite: false }),
        );
        ensoMesh.rotation.x = -Math.PI / 2;
        ensoMesh.position.y = 0.002;
        scene.add(ensoMesh);

        const inkMat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uLightDir: { value: new THREE.Vector3(0.35, 0.85, 0.4).normalize() },
          },
          vertexShader: INK_VERT,
          fragmentShader: INK_FRAG,
          side: THREE.DoubleSide,
        });
        const clayMat = new THREE.MeshStandardMaterial({
          color: 0xc8bfb0,
          roughness: 0.82,
          metalness: 0,
          side: THREE.DoubleSide,
        });
        scene.add(new THREE.AmbientLight(0xfff6ea, 0.65));
        const key = new THREE.DirectionalLight(0xfff8ee, 1.15);
        key.position.set(2.2, 4.2, 2.4);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0xd9e2ea, 0.35);
        fill.position.set(-2.5, 1.6, -1.4);
        scene.add(fill);

        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let mixer = null;
        const actions = new Map();
        let current = null;
        let useInk = true;
        const skinned = [];
        let raf = 0;
        let disposed = false;
        const observer = new ResizeObserver(resize);

        function resize() {
          const w = stage.clientWidth || innerWidth || 1;
          const h = stage.clientHeight || innerHeight || 1;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h, false);
        }
        function dispose() {
          if (disposed) return;
          disposed = true;
          cancelAnimationFrame(raf);
          observer.disconnect();
          controls.dispose();
          inkMat.dispose();
          clayMat.dispose();
          enso.dispose();
          ground.geometry.dispose();
          ground.material.dispose();
          ensoMesh.geometry.dispose();
          ensoMesh.material.dispose();
          renderer.dispose();
          renderer.domElement.remove();
        }
        resize();
        observer.observe(stage);
        renderer.render(scene, camera);

        try {
          const buf = await fetchModel(signal);
          if (isCancelled()) { dispose(); return null; }
          const gltf = await new GLTFLoader().parseAsync(buf, new URL("public/", document.baseURI).href);
          if (isCancelled()) { dispose(); return null; }
          const model = gltf.scene;
          model.traverse((child) => {
            if (!child.isMesh) return;
            skinned.push(child);
            child.material = clayMat;
            child.frustumCulled = false;
          });
          const rawSize = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
          const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z) || 1;
          model.scale.setScalar(1.7 / maxDim);
          const center = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
          model.position.sub(center);
          model.position.y -= new THREE.Box3().setFromObject(model).min.y;
          scene.add(model);
          mixer = new THREE.AnimationMixer(model);
          for (const clip of gltf.animations) {
            const action = mixer.clipAction(clip);
            action.loop = THREE.LoopRepeat;
            actions.set(clip.name, action);
          }
          const idle = actions.get("idle") ?? actions.values().next().value;
          if (idle) { idle.play(); current = idle; }
          renderer.render(scene, camera);
          await new Promise((resolve) => setTimeout(resolve, 32));
          if (isCancelled()) { dispose(); return null; }
          try {
            if (wantInk) {
              for (const mesh of skinned) mesh.material = inkMat;
              renderer.render(scene, camera);
            }
          } catch (err) {
            console.error(err);
            useInk = false;
            for (const mesh of skinned) mesh.material = clayMat;
          }
          let last = performance.now();
          const frame = (now) => {
            raf = requestAnimationFrame(frame);
            const dt = Math.min((now - last) / 1000, 0.05);
            last = now;
            if (document.hidden) return;
            if (!reduceMotion && useInk) inkMat.uniforms.uTime.value += dt;
            mixer?.update(dt);
            controls.update();
            renderer.render(scene, camera);
          };
          frame(performance.now());
          return {
            names: gltf.animations.map((clip) => clip.name),
            play(name) {
              const nextAction = actions.get(name);
              if (!nextAction || nextAction === current) return;
              if (current) current.fadeOut(0.28);
              nextAction.reset().fadeIn(0.28).play();
              current = nextAction;
            },
            setInk(nextInk) {
              if (!useInk && nextInk) return;
              useInk = nextInk;
              const mat = nextInk ? inkMat : clayMat;
              for (const mesh of skinned) mesh.material = mat;
            },
            resetView() {
              camera.position.copy(homePos);
              controls.target.copy(homeTarget);
              controls.update();
            },
            dispose,
          };
        } catch (err) {
          dispose();
          throw err;
        }
      }

      async function boot(token) {
        api?.dispose();
        api = null;
        showStatus("loading");
        const abort = new AbortController();
        boot.abort?.abort();
        boot.abort = abort;
        try {
          const next = await mountViewer(() => token !== attempt, abort.signal);
          if (!next || token !== attempt) {
            next?.dispose();
            return;
          }
          api = next;
          names = next.names;
          if (!names.includes(active)) active = names[0] ?? active;
          api.setInk(wantInk);
          api.play(active);
          renderChips();
          showStatus("ready");
        } catch (err) {
          if (token !== attempt) return;
          console.error(err);
          showStatus("error");
        }
      }

      boot(attempt);
    </script>
  </body>
</html>
